<style>
:root {
  --ink: #d7d3c8;
  --ink-soft: rgba(215, 211, 200, .62);
  --paper: #2a2a2a;
  --paper-warm: #333333;
  --rule: rgba(215, 211, 200, .16);
  --accent: #c5a258;
  --accent-soft: #c9b684;
  --font-display: "Didot", "Cormorant Garamond", "Playfair Display", Georgia, serif;
  --font-body: "Inter", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }

body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body.locked { overflow: hidden; }

a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-soft); }

.ba-header { position: sticky; top: 0; z-index: 100; background: #fff; border-bottom: 1px solid var(--rule); padding: 18px 20px; text-align: center; }
.ba-header__logo { font-family: var(--font-body); font-size: 16px; font-weight: 700; letter-spacing: 5px; color: #000; text-transform: uppercase; text-decoration: none; }

.wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

.hero { padding: clamp(3rem, 8vw, 6rem) 0 clamp(2rem, 5vw, 3.5rem); text-align: center; }
.eyebrow { font-size: .8rem; letter-spacing: .28em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 1rem; }
.hero h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2.2rem, 5vw, 3.6rem); margin: 0 0 .6rem; color: #fff; }
.hero .lede { font-family: var(--font-display); font-style: italic; color: var(--ink-soft); font-size: 1.15rem; max-width: 640px; margin: 0 auto; }
.updated { margin-top: 1.4rem; font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-soft); }

.bucket { padding: clamp(2.5rem, 5vw, 4rem) 0; border-top: 1px solid var(--rule); }
.bucket-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem; }
.bucket-head h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.7rem, 3.2vw, 2.4rem); margin: 0; color: #fff; }
.bucket-head .count { font-size: .78rem; letter-spacing: .2em; text-transform: uppercase; color: var(--accent-soft); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.25rem; }

.card { background: var(--paper-warm); border: 1px solid var(--rule); border-radius: 4px; padding: 1.5rem 1.5rem 1.25rem; display: flex; flex-direction: column; gap: .75rem; transition: border-color .2s ease, transform .2s ease; }
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card .label { font-size: .68rem; letter-spacing: .28em; text-transform: uppercase; color: var(--ink-soft); }
.card h3 { font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; margin: 0; color: #fff; line-height: 1.25; }
.card .meta { font-size: .85rem; color: var(--ink-soft); display: flex; flex-direction: column; gap: .2rem; }
.card .meta strong { color: var(--ink); font-weight: 500; }
.card .rows { font-family: var(--font-display); font-size: 1.8rem; color: var(--accent); line-height: 1; margin-top: .3rem; }
.card .rows-unit { font-size: .7rem; letter-spacing: .2em; color: var(--ink-soft); text-transform: uppercase; }
.card .actions { margin-top: auto; padding-top: .75rem; border-top: 1px solid var(--rule); display: flex; gap: .8rem; flex-wrap: wrap; }
.card .actions a { font-size: .75rem; letter-spacing: .15em; text-transform: uppercase; font-weight: 500; }
.tag { display: inline-block; font-size: .65rem; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-soft); border: 1px solid var(--rule); padding: .15rem .5rem; border-radius: 2px; }
.tag.dup { color: #d99; border-color: rgba(217, 153, 153, .35); }

footer.site { background: #0d0d0d; color: var(--accent-soft); text-align: center; padding: 2.5rem 24px; font-family: var(--font-body); font-size: .78rem; letter-spacing: .2em; text-transform: uppercase; margin-top: 3rem; }
footer.site .footer-logo { display: block; font-family: var(--font-body); font-size: 14px; font-weight: 700; letter-spacing: 5px; color: var(--accent); margin-bottom: 1rem; }
footer.site .footer-tag { margin-top: 1rem; font-size: .65rem; color: #555; letter-spacing: .15em; }

/* ---------- Lock screen ---------- */
#lock-screen { position: fixed; inset: 0; background: var(--paper); display: flex; align-items: center; justify-content: center; z-index: 9999; flex-direction: column; padding: 20px; }
#lock-screen .lock-logo { font-family: var(--font-body); font-size: 16px; font-weight: 700; letter-spacing: 5px; color: var(--accent); text-transform: uppercase; margin-bottom: 1.2rem; }
#lock-screen .lock-title { font-family: var(--font-display); font-size: 2rem; color: #fff; font-weight: 400; margin-bottom: .4rem; }
#lock-screen .lock-sub { font-size: .72rem; letter-spacing: .25em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 2.5rem; }
#lock-screen input { background: transparent; border: 1px solid var(--rule); color: #fff; padding: 14px 20px; font-size: 16px; min-width: 280px; font-family: var(--font-body); border-radius: 3px; letter-spacing: .15em; text-align: center; }
#lock-screen input:focus { outline: none; border-color: var(--accent); }
#lock-screen button { background: var(--accent); color: #1a1a1a; border: none; padding: 12px 36px; font-size: .8rem; font-weight: 700; letter-spacing: .25em; text-transform: uppercase; margin-top: 1rem; cursor: pointer; font-family: var(--font-body); border-radius: 3px; transition: background .15s; }
#lock-screen button:hover { background: var(--accent-soft); }
#lock-screen .err { color: #e57373; font-size: .8rem; margin-top: 1.2rem; height: 1rem; letter-spacing: .1em; }
</style>
</head>

const ITERATIONS = 250000;

function b64ToBuf(b64) { return Uint8Array.from(atob(b64), c => c.charCodeAt(0)); }

async function deriveKey(password) {
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']);
  return await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64ToBuf(SALT_B64), iterations: ITERATIONS, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
}

async function tryUnlock(password) {
  try {
    const key = await deriveKey(password);
    const ct = b64ToBuf(CT_B64);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBuf(IV_B64) }, key, ct);
    const html = new TextDecoder().decode(plain);
    document.getElementById('content-target').innerHTML = html;
    document.getElementById('lock-screen').remove();
    document.body.classList.remove('locked');
    return true;
  } catch (e) {
    return false;
  }
}

document.getElementById('lock-submit').addEventListener('click', async () => {
  const pwd = document.getElementById('lock-pwd').value;
  const errEl = document.getElementById('lock-err');
  errEl.textContent = '';
  if (!pwd) return;
  const ok = await tryUnlock(pwd);
  if (!ok) errEl.textContent = 'Wrong password';
});
document.getElementById('lock-pwd').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('lock-submit').click();
});
</script>
