<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bez × Darryl</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: 'Inter', -apple-system, sans-serif; background: #fafbfc; }
  #lock { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; background: #fafbfc; background-image: radial-gradient(circle at 30% 30%, rgba(16,185,129,0.08), transparent 50%), radial-gradient(circle at 70% 70%, rgba(37,99,235,0.05), transparent 50%); z-index: 9999; }
  #lock .logo { font-family: 'Cormorant Garamond', serif; font-size: 60px; color: #0f172a; font-weight: 400; letter-spacing: 0.02em; }
  #lock .logo::after { content: ''; display: block; width: 48px; height: 3px; background: linear-gradient(90deg, #10b981, #0d9488); border-radius: 2px; margin: 10px auto 0; }
  #lock .sub { color: #64748b; letter-spacing: 0.12em; text-transform: uppercase; font-size: 11px; margin: 18px 0 44px; font-weight: 700; }
  #lock input { background: #fff; border: 1px solid #e5e7eb; color: #0f172a; padding: 14px 22px; font-size: 16px; border-radius: 12px; min-width: 300px; box-shadow: 0 1px 3px rgba(15,23,42,0.04); }
  #lock input:focus { outline: none; border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.15); }
  #lock button { background: #0f172a; color: #fff; border: none; padding: 13px 32px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; border-radius: 999px; margin-top: 16px; cursor: pointer; }
  #lock button:hover { background: #1e293b; }
  #lock .err { color: #ef4444; font-size: 13px; margin-top: 16px; height: 16px; font-weight: 600; }
  #content { display: none; }
</style>
</head>
<body>
<div id="lock">
  <div class="logo">Bez × Darryl</div>
  <div class="sub">Working Page</div>
  <input type="password" id="pwd" placeholder="Password" autocomplete="current-password" autofocus />
  <button id="go">Enter</button>
  <div class="err" id="err"></div>
</div>
<div id="content"></div>

const SALT = "xefxpqc4+UrI4KiF2Dej0g==";
const IV = "hakcGuQwENURMxBk";
const ITER = 250000;

function b64ToBuf(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

async function unlock(password) {
  try {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64ToBuf(SALT), iterations: ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBuf(IV) }, key, b64ToBuf(ENC));
    const html = new TextDecoder().decode(plain);
    document.getElementById('lock').remove();
    const c = document.getElementById('content');
    c.style.display = 'block';
    // Parse decrypted HTML and inject its <body> contents + run any <style>
    const doc = new DOMParser().parseFromString(html, 'text/html');
    // Inject head styles
    doc.querySelectorAll('style, link[rel="stylesheet"]').forEach(el => document.head.appendChild(el.cloneNode(true)));
    // Inject body contents
    c.innerHTML = doc.body.innerHTML;
    return true;
  } catch (e) { return false; }
}

async function tryAutoUnlock() {
  const saved = sessionStorage.getItem('bez_pw');
  if (saved) {
    const ok = await unlock(saved);
    if (ok) return;
    sessionStorage.removeItem('bez_pw');
  }
}

document.getElementById('go').addEventListener('click', async () => {
  const pwd = document.getElementById('pwd').value;
  const err = document.getElementById('err');
  err.textContent = '';
  const ok = await unlock(pwd);
  if (ok) {
    sessionStorage.setItem('bez_pw', pwd);
  } else {
    err.textContent = 'Wrong password';
  }
});
document.getElementById('pwd').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('go').click();
});

tryAutoUnlock();
