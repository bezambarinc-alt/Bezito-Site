<style>
  :root {
    --serif: 'EB Garamond', Georgia, serif;
    --sans: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --ink: #1a1a1a;
    --ink-soft: #4a4a4a;
    --ink-muted: #8a8a8a;
    --paper: #ffffff;
    --paper-warm: #faf7f2;
    --rule: rgba(0,0,0,.08);
    --accent: #95826b;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
  }
  #lock {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--paper);
    padding: 20px;
    z-index: 9999;
  }
  #lock .brand {
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 5px;
    color: var(--ink);
    text-transform: uppercase;
    margin-bottom: 60px;
  }
  #lock .eyebrow {
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
  }
  #lock .title {
    font-family: var(--sans);
    font-size: clamp(24px, 3vw, 32px);
    font-weight: 200;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
    margin-bottom: 12px;
  }
  #lock .sub {
    font-family: var(--serif);
    font-size: 15px;
    color: var(--ink-soft);
    margin-bottom: 44px;
    text-align: center;
    max-width: 380px;
  }
  #lock input {
    background: var(--paper);
    border: 1px solid var(--rule);
    color: var(--ink);
    padding: 14px 20px;
    font-family: var(--sans);
    font-size: 15px;
    letter-spacing: 0.05em;
    width: 280px;
    text-align: center;
    border-radius: 2px;
  }
  #lock input:focus {
    outline: none;
    border-color: var(--ink);
  }
  #lock button {
    background: var(--ink);
    color: var(--paper);
    border: 0;
    padding: 14px 40px;
    margin-top: 14px;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: background .2s;
  }
  #lock button:hover { background: #000; }
  #lock .err {
    color: #b22e2e;
    font-family: var(--sans);
    font-size: 12px;
    letter-spacing: 0.06em;
    margin-top: 20px;
    height: 16px;
  }
  #content { display: none; }
</style>
</head>
<body>
<div id="lock">
  <div class="brand">Bez Ambar</div>
  <div class="eyebrow">Reference · Design Board</div>
  <div class="title">Inspirations</div>
  <div class="sub">Internal inspiration board. Enter password to continue.</div>
  <input type="password" id="pwd" placeholder="Password" autocomplete="current-password" autofocus />
  <button id="go">Enter</button>
  <div class="err" id="err"></div>
</div>
<div id="content"></div>

const SALT = "3JPqkCFfwvo8aV8LDOZFxw==";
const IV = "ZJ7XGXpZ9zjAPU29";
const ITER = 250000;

function b64ToBuf(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

async function unlock(password) {
  try {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64ToBuf(SALT), iterations: ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBuf(IV) }, key, b64ToBuf(ENC));
    const html = new TextDecoder().decode(plain);
    document.getElementById('lock').remove();
    const c = document.getElementById('content');
    c.style.display = 'block';

    const doc = new DOMParser().parseFromString(html, 'text/html');

    doc.querySelectorAll('style, link[rel="stylesheet"], link[href*="fonts"]').forEach(el => {
      document.head.appendChild(el.cloneNode(true));
    });

    const bodyClone = doc.body.cloneNode(true);
    const scripts = Array.from(bodyClone.querySelectorAll('script'));
    scripts.forEach(s => s.remove());
    c.innerHTML = bodyClone.innerHTML;

    scripts.forEach(oldScript => {
      const newScript = document.createElement('script');
      Array.from(oldScript.attributes).forEach(a => newScript.setAttribute(a.name, a.value));
      newScript.textContent = oldScript.textContent;
      document.body.appendChild(newScript);
    });

    return true;
  } catch (e) { return false; }
}

document.getElementById('go').addEventListener('click', async () => {
  const pwd = document.getElementById('pwd').value;
  const err = document.getElementById('err');
  err.textContent = '';
  const ok = await unlock(pwd);
  if (!ok) err.textContent = 'Wrong password';
});
document.getElementById('pwd').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('go').click();
});
